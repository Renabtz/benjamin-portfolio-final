<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Mockup of a smart building security dashboard">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1128"/><stop offset="1" stop-color="#14224d"/></linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1e6bff"/><stop offset="1" stop-color="#4d8dff"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e6bff" stop-opacity=".45"/><stop offset="1" stop-color="#1e6bff" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- window bar -->
  <rect y="0" width="800" height="36" fill="#0d1636"/>
  <circle cx="20" cy="18" r="5" fill="#e5233b"/><circle cx="38" cy="18" r="5" fill="#f5b83d"/><circle cx="56" cy="18" r="5" fill="#27e08a"/>
  <text x="400" y="23" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#7f8db3">smart-building-dashboard</text>
  <!-- sidebar -->
  <rect x="0" y="36" width="150" height="464" fill="#0b1330"/>
  <text x="20" y="72" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">SecureSite</text>
  <rect x="12" y="92" width="126" height="30" rx="8" fill="#1e6bff" opacity=".25"/>
  <text x="26" y="112" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">Overview</text>
  <text x="26" y="146" font-family="Arial, sans-serif" font-size="12" fill="#7f8db3">Access control</text>
  <text x="26" y="176" font-family="Arial, sans-serif" font-size="12" fill="#7f8db3">Cameras</text>
  <text x="26" y="206" font-family="Arial, sans-serif" font-size="12" fill="#7f8db3">HVAC</text>
  <text x="26" y="236" font-family="Arial, sans-serif" font-size="12" fill="#7f8db3">Alerts</text>
  <!-- metric cards -->
  <g font-family="Arial, sans-serif">
    <rect x="170" y="56" width="190" height="86" rx="12" fill="#ffffff" opacity=".07" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="186" y="82" font-size="12" fill="#a9b6d6">Doors secured</text>
    <text x="186" y="122" font-size="34" font-weight="bold" fill="#ffffff">24/26</text>
    <rect x="380" y="56" width="190" height="86" rx="12" fill="#ffffff" opacity=".07" stroke="#ffffff" stroke-opacity=".12"/>
    <text x="396" y="82" font-size="12" fill="#a9b6d6">Cameras online</text>
    <text x="396" y="122" font-size="34" font-weight="bold" fill="#ffffff">18/18</text>
    <rect x="590" y="56" width="190" height="86" rx="12" fill="#e5233b" opacity=".16" stroke="#e5233b" stroke-opacity=".6"/>
    <text x="606" y="82" font-size="12" fill="#ffb3bd">Active alerts</text>
    <text x="606" y="122" font-size="34" font-weight="bold" fill="#ff4d63">3</text>
  </g>
  <!-- chart -->
  <rect x="170" y="160" width="400" height="200" rx="12" fill="#ffffff" opacity=".07" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="186" y="186" font-family="Arial, sans-serif" font-size="12" fill="#a9b6d6">Network traffic (last 24h)</text>
  <path d="M186 330 L230 300 L274 312 L318 268 L362 284 L406 236 L450 258 L494 214 L538 232 L554 206 L554 340 L186 340 Z" fill="url(#area)"/>
  <polyline points="186,330 230,300 274,312 318,268 362,284 406,236 450,258 494,214 538,232 554,206" fill="none" stroke="url(#line)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="554" cy="206" r="5" fill="#ffffff"/>
  <!-- device list -->
  <rect x="590" y="160" width="190" height="200" rx="12" fill="#ffffff" opacity=".07" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="606" y="186" font-family="Arial, sans-serif" font-size="12" fill="#a9b6d6">Device status</text>
  <g font-family="Arial, sans-serif" font-size="12" fill="#ffffff">
    <circle cx="612" cy="214" r="5" fill="#27e08a"/><text x="626" y="218">Main entrance lock</text>
    <circle cx="612" cy="244" r="5" fill="#27e08a"/><text x="626" y="248">Lobby camera</text>
    <circle cx="612" cy="274" r="5" fill="#e5233b"/><text x="626" y="278">Server room sensor</text>
    <circle cx="612" cy="304" r="5" fill="#f5b83d"/><text x="626" y="308">HVAC controller</text>
    <circle cx="612" cy="334" r="5" fill="#27e08a"/><text x="626" y="338">Fire panel</text>
  </g>
  <!-- bottom strip -->
  <rect x="170" y="376" width="610" height="96" rx="12" fill="#ffffff" opacity=".07" stroke="#ffffff" stroke-opacity=".12"/>
  <text x="186" y="402" font-family="Arial, sans-serif" font-size="12" fill="#a9b6d6">Recent events</text>
  <g font-family="Arial, sans-serif" font-size="12" fill="#ffffff">
    <text x="186" y="426">09:14  Server room sensor: unusual access attempt</text>
    <text x="186" y="448" fill="#ff4d63">09:02  HVAC controller: firmware out of date</text>
    <text x="186" y="466" fill="#a9b6d6" font-size="11">08:40  All cameras passed health check</text>
  </g>
</svg>
