<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Mockup of a password strength checker interface">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a1128"/><stop offset="1" stop-color="#1a1240"/></linearGradient>
    <linearGradient id="meter" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e5233b"/><stop offset=".5" stop-color="#f5b83d"/><stop offset="1" stop-color="#1e6bff"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <circle cx="680" cy="80" r="140" fill="#1e6bff" opacity=".14"/>
  <circle cx="100" cy="440" r="120" fill="#e5233b" opacity=".12"/>
  <!-- card -->
  <rect x="150" y="60" width="500" height="380" rx="20" fill="#ffffff" opacity=".07" stroke="#ffffff" stroke-opacity=".15"/>
  <g font-family="Arial, sans-serif">
    <text x="190" y="115" font-size="22" font-weight="bold" fill="#ffffff">Password Strength Checker</text>
    <text x="190" y="140" font-size="13" fill="#a9b6d6">Type a password to see how strong it is</text>
    <!-- input -->
    <rect x="190" y="164" width="420" height="48" rx="10" fill="#0a1128" stroke="#4d8dff" stroke-width="1.5"/>
    <text x="208" y="196" font-size="22" fill="#ffffff" letter-spacing="3">&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;</text>
    <!-- meter -->
    <rect x="190" y="236" width="420" height="12" rx="6" fill="#ffffff" opacity=".12"/>
    <rect x="190" y="236" width="320" height="12" rx="6" fill="url(#meter)"/>
    <text x="190" y="274" font-size="14" font-weight="bold" fill="#4d8dff">Strong</text>
    <text x="610" y="274" font-size="13" text-anchor="end" fill="#a9b6d6">Score 4 / 5</text>
    <!-- checklist -->
    <g font-size="14" fill="#ffffff">
      <circle cx="198" cy="312" r="7" fill="#27e08a"/><text x="216" y="317">At least 12 characters</text>
      <circle cx="198" cy="342" r="7" fill="#27e08a"/><text x="216" y="347">Upper and lower case letters</text>
      <circle cx="198" cy="372" r="7" fill="#27e08a"/><text x="216" y="377">Contains numbers</text>
      <circle cx="198" cy="402" r="7" fill="#e5233b"/><text x="216" y="407">Contains a symbol (!@#$%)</text>
    </g>
  </g>
</svg>
