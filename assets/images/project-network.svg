<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Mockup of a Python network inventory tool running in a terminal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060b1d"/><stop offset="1" stop-color="#0f1a3a"/></linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect y="0" width="800" height="36" fill="#0d1636"/>
  <circle cx="20" cy="18" r="5" fill="#e5233b"/><circle cx="38" cy="18" r="5" fill="#f5b83d"/><circle cx="56" cy="18" r="5" fill="#27e08a"/>
  <text x="400" y="23" text-anchor="middle" font-family="Courier New, monospace" font-size="12" fill="#7f8db3">python network_inventory.py --subnet 192.168.1.0/24</text>
  <g font-family="Courier New, monospace" font-size="14">
    <text x="30" y="76" fill="#27e08a">$ python network_inventory.py --subnet 192.168.1.0/24</text>
    <text x="30" y="104" fill="#4d8dff">[*] Scanning facility network...</text>
    <text x="30" y="126" fill="#4d8dff">[*] 7 devices found</text>

    <text x="30" y="166" fill="#a9b6d6">IP ADDRESS      TYPE            VENDOR       RISK</text>
    <line x1="30" y1="176" x2="770" y2="176" stroke="#ffffff" stroke-opacity=".2"/>

    <text x="30" y="204" fill="#ffffff">192.168.1.1     Router          Cisco        </text><text x="560" y="204" fill="#27e08a">LOW</text>
    <text x="30" y="232" fill="#ffffff">192.168.1.10    Door controller Honeywell    </text><text x="560" y="232" fill="#27e08a">LOW</text>
    <text x="30" y="260" fill="#ffffff">192.168.1.14    IP camera       Hikvision    </text><text x="560" y="260" fill="#ff4d63" font-weight="bold">HIGH</text>
    <text x="30" y="288" fill="#ffffff">192.168.1.21    HVAC gateway    Siemens      </text><text x="560" y="288" fill="#f5b83d">MEDIUM</text>
    <text x="30" y="316" fill="#ffffff">192.168.1.33    Smart thermostat Generic     </text><text x="560" y="316" fill="#f5b83d">MEDIUM</text>
    <text x="30" y="344" fill="#ffffff">192.168.1.40    Badge reader    HID          </text><text x="560" y="344" fill="#27e08a">LOW</text>
    <text x="30" y="372" fill="#ffffff">192.168.1.52    Unknown device  ???          </text><text x="560" y="372" fill="#ff4d63" font-weight="bold">HIGH</text>

    <text x="30" y="414" fill="#ff4d63">[!] 192.168.1.14 still uses default login (admin/admin)</text>
    <text x="30" y="438" fill="#ff4d63">[!] 192.168.1.52 is not in the approved device list</text>
    <text x="30" y="468" fill="#27e08a">$ <tspan fill="#ffffff">report saved to inventory_report.csv</tspan></text>
  </g>
</svg>
